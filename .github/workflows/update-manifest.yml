name: update-manifest

on:
  repository_dispatch:
    types: [tool-released]
  workflow_dispatch:
    inputs:
      tool:
        required: true
        description: Tool name
      component:
        default: cli
        type: choice
        options: [cli, desktop]
      tag:
        required: true
        description: Release tag
      repo:
        required: true
        description: Public release repository
      major:
        description: Major version (required for Zipover)

permissions:
  contents: write

concurrency:
  group: package-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      tool: ${{ steps.release.outputs.tool }}
      component: ${{ steps.release.outputs.component }}
    steps:
      - name: Validate release source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ github.event.client_payload.tool || inputs.tool }}
          COMPONENT: ${{ github.event.client_payload.component || inputs.component }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          REPO: ${{ github.event.client_payload.repo || inputs.repo }}
          MAJOR: ${{ github.event_name == 'repository_dispatch' && format('{0}', github.event.client_payload.major) || inputs.major }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TOOL" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]
          tag_major="${BASH_REMATCH[1]}"
          if [[ "$TOOL" == zipover ]]; then
            test "$MAJOR" = "$tag_major"
            case "$COMPONENT:$REPO" in
              cli:harrisonwang/zipover) ;;
              desktop:harrisonwang/zipover-releases) test "$MAJOR" = 1 ;;
              *) echo '::error::Unapproved Zipover release source'; exit 1 ;;
            esac
          else
            COMPONENT="${COMPONENT:-cli}"
            test "$COMPONENT" = cli
            test "$REPO" = "harrisonwang/$TOOL"
          fi
          if [[ "$COMPONENT" == desktop ]]; then
            output=bucket/zipover-gui.json
            template=.github/scoop/zipover-gui.json.tmpl
            gh api "repos/$REPO/contents/channels/v1.json" --jq .content | base64 --decode > channel.json
            test "$(jq -r .tag channel.json)" = "$TAG" || { echo '::error::Release is no longer the current Desktop channel'; exit 1; }
          else
            if [[ "$TOOL" == zipover ]]; then
              gh api "repos/$REPO/releases/latest" > latest.json
              test "$(jq -r .tag_name latest.json)" = "$TAG" || { echo '::error::Release is no longer the latest CLI version'; exit 1; }
            fi
            output="bucket/${TOOL}.json"
            template="src/.github/scoop/${TOOL}.json.tmpl"
          fi
          echo "tool=$TOOL" >> "$GITHUB_OUTPUT"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "output=$output" >> "$GITHUB_OUTPUT"
          echo "template=$template" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - name: Test package renderer
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Checkout public CLI source templates
        if: steps.release.outputs.component == 'cli'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.release.outputs.repo }}
          ref: ${{ steps.release.outputs.tag }}
          path: src
      - name: Verify downloads and render package
        env:
          TOOL: ${{ steps.release.outputs.tool }}
          TAG: ${{ steps.release.outputs.tag }}
          REPO: ${{ steps.release.outputs.repo }}
          TEMPLATE: ${{ steps.release.outputs.template }}
          OUTPUT: ${{ steps.release.outputs.output }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/$REPO/releases/download/$TAG/SHA256SUMS.txt" -o "$RUNNER_TEMP/SHA256SUMS.txt"
          python3 scripts/render_manifest.py --template "$TEMPLATE" --checksums "$RUNNER_TEMP/SHA256SUMS.txt" --output "$OUTPUT" --verify-downloads
          python3 -m json.tool "$OUTPUT" > /dev/null
      - name: Commit and push package update
        env:
          TOOL: ${{ steps.release.outputs.tool }}
          COMPONENT: ${{ steps.release.outputs.component }}
          TAG: ${{ steps.release.outputs.tag }}
          OUTPUT: ${{ steps.release.outputs.output }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT"
          if ! git diff --cached --quiet; then
            git commit -m "$TOOL $COMPONENT $TAG"
            git push
          fi

  install-windows:
    if: needs.update.outputs.tool == 'zipover'
    needs: update
    runs-on: windows-latest
    steps:
      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-WebRequest https://get.scoop.sh -OutFile "$env:RUNNER_TEMP/install-scoop.ps1"
          & "$env:RUNNER_TEMP/install-scoop.ps1" -RunAsAdmin
          "$env:USERPROFILE/scoop/shims" >> $env:GITHUB_PATH
      - name: Install and check package
        shell: pwsh
        env:
          COMPONENT: ${{ needs.update.outputs.component }}
        run: |
          $package = if ($env:COMPONENT -eq 'desktop') { 'zipover-gui' } else { 'zipover' }
          scoop bucket add harrisonwang https://github.com/harrisonwang/scoop-bucket
          if ($LASTEXITCODE) { throw 'Adding the Scoop bucket failed' }
          scoop install "harrisonwang/$package"
          if ($LASTEXITCODE) { throw 'Package installation failed' }
          $prefix = (scoop prefix $package).Trim()
          foreach ($notice in @('LICENSE', 'THIRD-PARTY-NOTICES_x86_64-pc-windows-msvc.txt')) {
            if (!(Test-Path "$prefix/$notice")) { throw "Missing installed notice: $notice" }
          }
          $process = Start-Process -FilePath "$prefix/$package.exe" -ArgumentList '--version' -Wait -PassThru
          if ($process.ExitCode) { throw 'Installed executable smoke check failed' }
